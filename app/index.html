<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trade Journal — SBI証券 収支分析</title>
    <meta name="description" content="SBI証券のCSVから、株式トレードの収支を端末内だけで集計・分析します" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOSでホーム画面から起動したときにブラウザUIを出さない -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trade Journal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f4f4f2" />

    <!-- 描画前にテーマを確定させ、切り替わりのちらつきを防ぐ -->
    <script>
      (function () {
        try {
          var k = 'trade-journal.theme'
          var v = localStorage.getItem(k)
          if (v !== 'light' && v !== 'navy' && v !== 'black') {
            v = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'black' : 'light'
          }
          document.documentElement.dataset.theme = v
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
